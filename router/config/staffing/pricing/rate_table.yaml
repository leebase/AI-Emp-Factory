  # D218 intake (chief-of-staff/decisions.md 2026-09-12): DeepSeek V4.1 Flash
  # via Pi/OpenRouter, candidate metered workhorse. OpenRouter catalog base
  # rates (per token): prompt 0.00000015, completion 0.0000006,
  # input_cache_read 0.000000003. Basis: lee-llm-router
  # config/staffing/pricing/openrouter-20260911.json (observed 2026-09-11).
  # The catalog row also carries UTC-time-of-day peak/off-peak overrides
  # (peak: prompt 0.0000003, completion 0.0000012, cache-read 0.000000006);
  # this rate table, like the router's terms module, records only the base
  # rate — no time-of-day pricing is modeled anywhere in the pricing stack.
  # No cache-write rate is published.
  deepseek/deepseek-v4.1-flash:
    source_url: "https://openrouter.ai/api/v1/models"
    as_of: "2026-09-11"
    input_usd_per_1m: 0.15

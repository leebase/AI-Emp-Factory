# Staffing route catalog — Codex CLI / openai-sub only (P0-3b).
#
# Route identity is the tuple (model, effort, harness, channel). Every row
# below preserves that tuple explicitly.
#
# P1-1: every dispatch template below names its stage-worker script as
#   python3 @STAGE_WORKER_DIR@/<name>_stage_worker.py, not as a hard-coded
#   path. lee_llm_router.staffing.catalog is the one resolution point and
#   substitutes the token at catalog load time: LEE_LLM_ROUTER_STAGE_WORKER_DIR
#   when set and non-empty, otherwise /home/lee/projects/auto-orch/scripts
#   (the historical value), so an unset environment loads these templates
#   byte-identically to before. No other part of a template is rewritten,
#   and no stage-worker script is moved, copied, or edited by this change.
#   Comment lines below keep their original provenance citations verbatim.
#
# P1-2: every dispatch template below hands its harness binary to the stage
#   worker as <PREFIX>_STAGE_WORKER_BINARY=@<HARNESS>_BINARY@, not as a
#   hard-coded path — the same token convention and the same resolution
#   point as P1-1. lee_llm_router.staffing.catalog substitutes each token
#   at catalog load time in this order: the harness override variable
#   LEE_LLM_ROUTER_<HARNESS>_BINARY (codex -> LEE_LLM_ROUTER_CODEX_BINARY,
#   pi -> LEE_LLM_ROUTER_PI_BINARY, opencode -> LEE_LLM_ROUTER_OPENCODE_BINARY,
#   claude -> LEE_LLM_ROUTER_CLAUDE_BINARY, agy -> LEE_LLM_ROUTER_AGY_BINARY)
#   when set and non-empty; otherwise shutil.which(<binary name>); otherwise
#   the bare binary name, deferring the lookup to the PATH of the process
#   that finally executes the template. A token never resolves to another
#   harness's binary, and an unresolvable binary never fails catalog loading.
#   On a host that installs the five binaries at the paths these templates
#   used to hard-code, an unset environment loads them byte-identically to
#   before. No other part of a template is rewritten, and no harness binary
#   is moved, copied, installed, or edited by this change. Two provenance
#   comment lines below (P0-3d, P0-3f) still cite the historical binary
#   paths: they are citations, not dispatch data, and are left unchanged.
#
# Source of truth for the seven live rows:
#   /home/lee/projects/auto-orch/config/crews.yaml — codex_* workers
#     (codex_sol_high, codex_sol_medium, codex_sol_low, codex_terra_high,
#     codex_terra_medium, codex_luna_max, codex_luna_xhigh). Live aliases were
#     deduplicated by the route tuple; no two rows share a tuple.
#   Dispatch templates are copied exactly from the crews.yaml worker command
#   shape with only CODEX_STAGE_WORKER_MODEL and CODEX_STAGE_WORKER_REASONING_EFFORT
#   substituted per route — no flags invented or removed.
#   usage_capture is none for every Codex row: the codex_stage_worker.py
#   harness invokes `codex exec` without --json and writes only the extracted
#   JSON response, so token usage is not captured. Writing the response is
#   not usage capture.
#
# The gpt-6-astra row is the plan-required addition
# (gpt-6-astra|codex|low|openai-sub); it has no live auto-orch worker yet.
#
# P0-3c append — Claude / anthropic-sub rows only:
#   /home/lee/projects/auto-orch/config/crews.yaml — claude_* workers
#     (claude_fable51_high, claude_opus5_high, claude_opus5_medium,
#     claude_sonnet5_high, claude_sonnet5_medium). The backward-compatibility
#     alias claude_fable_high carries a byte-identical command to
#     claude_fable51_high, so it deduplicates to the same
#     (claude-fable-5-1, high, claude, anthropic-sub) tuple and is not
#     repeated. Dispatch templates are copied exactly from the crews.yaml
#     claude_* worker command with only CLAUDE_STAGE_WORKER_MODEL and
#     CLAUDE_STAGE_WORKER_EFFORT substituted per route — no flags invented
#     or removed.
#   Harness spelling follows the same staffing sidecar identity convention
#     as the Codex rows (crew_page.py HARNESS_BY_PROVIDER:
#     claude_code_cli -> "claude"), matching the claude_stage_worker.py
#     harness name.
#   usage_capture is none for every Claude row: the claude_stage_worker.py
#   harness invokes `claude --print --output-format text`, extracts the first
#   JSON object from stdout, and writes only that response to the response
#   path, so token usage is not captured. Writing the response is not usage
#   capture.
#   No Pi, Antigravity, or OpenCode rows in this packet.
#
# P0-3d append — Antigravity / gemini-sub rows only:
#   /home/lee/projects/auto-orch/config/crews.yaml lines 115-149 —
#     antigravity_gemini38_flash_high, antigravity_gemini38_flash_medium,
#     antigravity_gemini38_flash_low, antigravity_gemini31_pro. The
#     antigravity_gemini37_* workers are backward-compatibility aliases that
#     execute byte-identical gemini-3.8-flash commands, so they deduplicate to
#     the same route tuples and add no alias routes. Dispatch templates are
#     copied exactly from each worker command — no flags invented or removed;
#     the gemini-3.1-pro command carries no effort env var, so its effort is
#     null. Route ids omit a separate effort segment because each flash model
#     string already encodes its effort dial.
#   Harness "agy" is the router mapping for the antigravity
#     antigravity_stage_worker.py harness (ANTIGRAVITY_STAGE_WORKER_BINARY is
#     /home/lee/.local/bin/agy).
#   usage_capture is none for every Antigravity row: the worker writes only
#     the extracted response to the response path, so token usage is not
#     captured. Writing the response is not usage capture.
#
# P0-3e append — OpenCode / opencode-go rows only:
#   /home/lee/projects/auto-orch/config/crews.yaml lines 86-104 — the five
#     opencode_go_* workers (opencode_go_qwen37_plus, opencode_go_mimo_v25,
#     opencode_go_deepseek_v4_flash, opencode_go_deepseek_v4_pro,
#     opencode_go_minimax_m27). One route row per worker; no
#     backward-compatibility alias opencode workers exist, so no
#     deduplication applies. Dispatch templates are copied exactly from each
#     worker command — no flags invented or removed. The separate
#     glm-5.3-flash | pi | opencode-go route is NOT added in this packet.
#   Harness "opencode" is the router mapping for the opencode_cli provider
#     (crew_page.py HARNESS_BY_PROVIDER: opencode_cli -> "opencode").
#   Channel "opencode-go" is the router mapping (PROVIDER_CHANNELS:
#     opencode_cli -> opencode-go), matching the channel catalog id
#     (catalog.md CHANNELS / PROVIDER_CHANNELS).
#   model carries the exact OPENCODE_STAGE_WORKER_MODEL dial string from the
#     crews.yaml command (opencode-go/<id>); the worker env sets no effort
#     var (only BINARY, MODEL, AGENT, DIR), so effort is null.
#   usage_capture is none for every OpenCode row: opencode_stage_worker.py
#     runs `opencode run --format json` and consumes the JSON event stream,
#     but maps only type=="text" events to response text; every other event
#     (including any usage-bearing events) is discarded, and the success path
#     writes only the extracted JSON response — the raw stream reaches sidecar
#     files only on failure. Consuming the event stream is not usage capture.
#   Status per D207 (chief-answers-2 §3, amended by chief-answers-6):
#     four ids are priced by the pinned Zen snapshot
#     (config/staffing/pricing/opencode-zen-20260909.mdx, commit
#     70b4ca8c181e4c1ac6d8993b86249d824487ec65, sha256 b5b08064e24cd68e28b76c
#     3da7503c7bc361956cdc722bbea4359bc82d033a07, section ## Pricing) and are
#     active. The exact id opencode-go/mimo-v2.5 is unpriced: the pinned Zen
#     section ## Pricing lists only the distinct mimo-v2.5-free id, which is
#     not equated with the Go id; its row carries status_reason and is
#     recorded in needs-lee.md.


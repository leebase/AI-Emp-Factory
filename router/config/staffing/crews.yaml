# (one-crew append), the live opencode-go-balanced (one-crew
# append), the live gemini-flash-tiered (one-crew append), the
# live tri-vendor-workhorse (P0-3k4d one-crew append), and the
# live gemini-pro-crew (P0-3k4e one-crew append), plus the interactive
# sol-low-glm-pi (P0-3l one-crew append) and the interactive luna-sol
# (one-crew append). All fourteen live governed crews in the source are
# encoded.
#
# Live source (read, not forked — architecture recommendation §4 "Keep
# as-is"): /home/lee/projects/auto-orch/config/crews.yaml. Each crew cites
# its exact source block in evidence_ref. Every live governed crew in the
# source is encoded here.
#
# Round 9 governed contract (applied identically to all fourteen crews):
#
# 1. kind governed; source auto-orch/crews.yaml; crew_name is the live crew
#    id verbatim; supervisor {kind: engine, owner: auto-orch}; escalation
#    not-recorded; authority chief; evidence_ref. No supervisor_route,
#    reviewer_route, or escalation_ladder is ever invented for a governed
#    crew.
# 2. worker_routes carries the five recorded stage bindings under their
#    live role names (envision, ideate, reconsider, score, author — the
#    router's STAGE_NAMES). Every live stage in these fourteen crews binds
#    exactly one worker, so each role is a one-element array. Worker id ->
#    route_id via the route catalog: each live worker id deduplicates (by
#    the route tuple) to exactly one row in config/staffing/routes.yaml;
#    exactly one such row (opencode-opencode-go-mimo-v2-5-opencode-go,
#    serving opencode-go-economy's ideate and score stages and its governed
#    judge, and opencode-go-balanced's score stage) carries status:
#    unpriced, which chief-answers-6 requires to stay
#    in the catalog and map — exclusion from eligibility, not from the
#    catalog — so it is encoded, not omitted.
# 3. The governed primary/reviewer/judge role names are encoded in
#    worker_routes only when the live governed entry itself supplies enough
#    (harness, model, effort) evidence to resolve exactly one existing
#    route — never by inferring an effort from another role or another
#    crew. In all fourteen live blocks the governed entries record only
#    (harness[, model[, effort]]) and nothing beyond those fields. The
#    first six blocks and
#    anthropic-balanced (P0-3k4a2a) and anthropic-economy (P0-3k4a2b)
#    encode no governed role;
#    anthropic-flagship (P0-3k4a1) encodes exactly one:
#      - {harness: codex_cli} / {harness: claude_code} judge entries record
#        no model at all, so no route tuple exists without inventing one.
#      - gpt-5.6-sol on codex|openai-sub has three catalog routes (high,
#        medium, low); gpt-5.6-terra on codex|openai-sub has two (high,
#        medium); gpt-5.6-luna on codex|openai-sub has two (max, xhigh);
#        claude-opus-5 and claude-sonnet-5 on claude|anthropic-sub each
#        have two (high, medium). No governed model resolves uniquely in
#        those six blocks, so every governed primary/reviewer/judge role
#        there is omitted and the omission is recorded in evidence_ref.
#      - anthropic-flagship's governed reviewer {harness: claude_code,
#        model: claude-fable-5-1} is the sole unique resolution:
#        claude-fable-5-1|claude|anthropic-sub has exactly one catalog
#        route (claude-claude-fable-5-1-high-anthropic-sub), so the
#        reviewer is encoded with no effort inference. Its primary
#        (claude-opus-5, two routes) and judge (no model) are omitted as
#        ambiguous, recorded in evidence_ref.
#      - opencode-go-economy (one-crew append) encodes all three governed
#        roles: primary {harness: opencode_cli, model:
#        opencode-go/deepseek-v4-flash}, reviewer {harness: opencode_cli,
#        model: opencode-go/deepseek-v4-pro}, and judge {harness:
#        opencode_cli, model: opencode-go/mimo-v2.5}. Harness opencode_cli
#        maps to channel opencode-go (channels.yaml harness_lock) under the
#        catalog harness spelling opencode, and each Go model id has exactly
#        one catalog row (opencode-opencode-go-deepseek-v4-flash-opencode-go
#        and opencode-opencode-go-deepseek-v4-pro-opencode-go, both active;
#        opencode-opencode-go-mimo-v2-5-opencode-go, status: unpriced per
#        D207 and mapped per chief-answers-6), so each role resolves by full
#        route with no effort inference and no governed role is omitted.
#      - opencode-go-balanced (one-crew append) encodes all three governed
#        roles: primary {harness: opencode_cli, model:
#        opencode-go/qwen3.7-plus}, reviewer {harness: opencode_cli,
#        model: opencode-go/deepseek-v4-pro}, and judge {harness:
#        opencode_cli, model: opencode-go/minimax-m2.7}. Harness
#        opencode_cli maps to channel opencode-go (channels.yaml
#        harness_lock) under the catalog harness spelling opencode, and
#        each Go model id has exactly one catalog row
#        (opencode-opencode-go-qwen3-7-plus-opencode-go,
#        opencode-opencode-go-deepseek-v4-pro-opencode-go, and
#        opencode-opencode-go-minimax-m2-7-opencode-go, all active), so
#        each role resolves by full route with no effort inference and no
#        governed role is omitted.
#      - gemini-flash-tiered (one-crew append) encodes all three governed
#        roles: primary {harness: antigravity_cli, model:
#        gemini-3.8-flash-high}, reviewer {harness: antigravity_cli, model:
#        gemini-3.8-flash-medium}, and judge {harness: antigravity_cli,
#        model: gemini-3.8-flash-low}. Harness antigravity_cli maps to
#        channel gemini-sub (channels.yaml harness_lock) under the catalog
#        harness spelling agy (the router mapping for the
#        antigravity_stage_worker.py harness), and each flash model string
#        encodes its effort dial so each model id has exactly one catalog
#        row (agy-gemini-3-8-flash-high-gemini-sub,
#        agy-gemini-3-8-flash-medium-gemini-sub, and
#        agy-gemini-3-8-flash-low-gemini-sub, all active), so each role
#        resolves by full route with no effort inference and no governed
#        role is omitted.
#      - tri-vendor-workhorse (P0-3k4d one-crew append) encodes exactly one
#        governed role: primary {harness: antigravity_cli, model:
#        gemini-3.8-flash-high} resolves to exactly one catalog route
#        (agy-gemini-3-8-flash-high-gemini-sub, status: active) — each

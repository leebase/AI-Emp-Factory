# reviewer_independence: exactly two records, keyed by the staffing
# reviewer_ref names review and judge (Chief round 15 vocabulary mapping:
# review -> reviewer, judge -> evaluator). Each record copies its archived
# labor-ladder role's independence shape verbatim; no values are invented.
# Enforcement occurs only when explain receives --author-route (Chief round
# 15 ruling 2); with absent input, explain discloses "independence not
# evaluated (no --author-route)" rather than excluding routes. Independence
# is an author/candidate comparison, never a class-to-model preference
# (D206).

reviewer_independence:
  - reviewer_ref: review
    not_same_worker_as: authors
    prefer_different_family: true
    decision: >-
      The review staffing role maps to the archived reviewer role (Chief
      round 15) and carries the reviewer's archived independence shape
      verbatim: the reviewer must not be the same worker as the authors and
      a different model family is preferred. Independence is an
      author/candidate comparison, never a class-to-model preference
      (D206). Enforcement occurs only when explain receives --author-route;
      when the input is absent, explain discloses "independence not
      evaluated (no --author-route)" instead of excluding routes.
    source: >-
      Chief round 15 (chief-answers-15.md, ruling 1: the vocabulary mapping
      review -> reviewer; ruling 2: the explain --author-route behavior and
      the absent-input disclosure); archived labor-ladder/policy/roles.yaml
      (reviewer independence shape: not_same_worker_as: authors,
      prefer_different_family: true)
  - reviewer_ref: judge
    second_opinion_mode: different-family-than-author
    decision: >-
      The judge staffing role maps to the archived evaluator role (Chief
      round 15) and carries the evaluator's archived independence shape
      verbatim: the judge operates in second-opinion mode, different family
      than the author. Independence is an author/candidate comparison,
      never a class-to-model preference (D206). Enforcement occurs only
      when explain receives --author-route; when the input is absent,
      explain discloses "independence not evaluated (no --author-route)"
      instead of excluding routes.
    source: >-
      Chief round 15 (chief-answers-15.md, ruling 1: the vocabulary mapping
      judge -> evaluator; ruling 2: the explain --author-route behavior and
      the absent-input disclosure); archived labor-ladder/policy/roles.yaml
      (evaluator independence shape: second_opinion_mode:
      different-family-than-author)

spend_caps: []

# D215 ruling 3: Named-crew ordering rule — within a role's array, order by
# marginal price at authoring time with prepaid-first as the tie-break; a human
# may pin otherwise with a stated reason.
crew_ordering_rule:
  decision: >-
    Within a role's array, order by marginal price at authoring time with
    prepaid-first as the tie-break; a human may pin otherwise with a stated
    reason.
  source: decisions.md D215 ruling 3 (named-crew ordering rule recorded in
    policy.yaml)

# D216: subscription-channel reserve fraction (policy floor, distinct from
# the availability reader's health heuristics). Default 0.10 applies to every
# subscription channel; per-channel overrides list explicit values. When a
# channel's remaining_fraction in any binding window is at or below its
# reserve, the channel's routes are excluded from automatic staffing with a
# named reason citing D216. Anthropic and Gemini are explicitly 0.10 per D216.
reserve_fraction:
  default: 0.10
  overrides:
    - channel_id: anthropic-sub
      reserve_fraction: 0.10
    - channel_id: gemini-sub
      reserve_fraction: 0.10

# D211 ruling 3: terminal cost used by staffing ladder arithmetic when
# automated rungs are exhausted. Chief's placeholder; Lee may change it.
human_escalation_cost_usd: 5.00

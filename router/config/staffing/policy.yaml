# Staffing policy catalog — P0-3i.
#
# Shape authority: config/staffing/schema/policy.schema.json (P0-1) and
# docs/staffing/phase0-contracts.md §Policy. Every entry below cites its
# governing decision id in `decision`/`source`; nothing here is invented.
#
# Encoded entries are exactly the committed policy rules:
#   never_automatic — Fable 5.1, Opus 5, Luna Max (D152, D187, D204)
#   role_scoped     — Gemini 3.1 Pro, planner/reviewer only (D188)
#   role_class      — the D189-confirmed stage/role → governance-class mapping
# The three-entry never_automatic set is the contract set locked by D204
# item 2 ("Never-automatic set unchanged (Fable 5.1, Opus 5, Luna Max)"); it
# does not exhaust crews.py's legacy NEVER_AUTOMATIC_MODELS constant, which
# is pre-existing code data containing four live ids (claude-fable-5-1,
# claude-fable-5, gpt-5.6-luna, claude-opus-5) — the extra claude-fable-5 id
# has no contract-named entry here. Model refs are the live ids already
# committed in src/lee_llm_router/crews.py (NEVER_AUTOMATIC_MODELS,
# ROLE_SCOPED_MODELS) and docs/staffing/catalog.md (policy-constant home
# table): Fable 5.1 -> claude-fable-5-1, Opus 5 -> claude-opus-5, Luna Max ->
# gpt-5.6-luna, Gemini 3.1 Pro -> gemini-3.1-pro. The Fable and Opus rules
# are model-level; the Luna rule carries the schema's optional per-effort
# `effort` narrowing (`max`) because chief round 10 explicitly places
# `gpt-5.6-luna | pi | xhigh | openai-sub` as an automatic escalation rung
# in both interactive crews, so the never-automatic Luna rule is scoped to
# effort `max` and Luna XHigh stays eligible subject to the other rules.
# No other cited decision scopes any of these rules to an effort level.
#
# spend_caps remains an empty array: the contracts (phase0-contracts.md
# §Policy) require spend caps to cite their governing decision; no such
# decision is cited, so nothing is invented there.
#
# reviewer_independence holds exactly two records (Chief round 15): the
# vocabulary mapping review -> reviewer and judge -> evaluator plus the
# explain --author-route behavior come from chief-answers-15.md, and each
# record copies its archived labor-ladder roles.yaml independence shape
# verbatim. Independence is an author/candidate comparison, never a
# class-to-model preference (D206).
#
# role_floors: recorded data only in Phase 0 (Chief round 15, D86/D87). Each
# record keys a staffing role name to the floor copied verbatim from the
# archived labor-ladder tier policy via the Chief round 15 vocabulary mapping.
# Floors are NOT enforced: no authority has assigned T1-T4 tiers to the
# current models (labor-ladder's tiers name retired models), so these records
# carry no effective dates and drive no selection behavior. Enforcement
# arrives in Phase 2 with evidence-based tiers or a Lee decision.
#
# D206 (decisions.md 2026-09-09, verbatim contract in phase0-contracts.md):
# "Class metadata MUST NOT map directly to a preferred model or route. It may
# only: 1. join production attempts to comparable benchmark evidence; and
# 2. determine whether an unevidenced cheap trial is permitted." The
# `role_class` entries below are role-to-class governance only; nothing in
# this file maps a class to a model or route.

never_automatic:
  - model_ref: claude-fable-5-1
    decision: >-
      Fable 5.1 must never be used in an automatic selection: a resolver may
      reach it only when a crew names the model explicitly (never automatic).
    source: >-
      decisions.md D152 (model-routing ladder for the escalation cascade);
      D187 (D152-D158 ladder rules bind the crew-aware resolver); D204 item 2
      (never-automatic set unchanged: Fable 5.1, Opus 5, Luna Max)
  - model_ref: claude-opus-5
    decision: >-
      Opus 5 must never be used in an automatic selection: a resolver may
      reach it only when a crew names the model explicitly (never automatic).
    source: >-
      decisions.md D152 (model-routing ladder for the escalation cascade);
      D187 (D152-D158 ladder rules bind the crew-aware resolver); D204 item 2
      (never-automatic set unchanged: Fable 5.1, Opus 5, Luna Max)
  - model_ref: gpt-5.6-luna
    effort: max
    decision: >-
      Luna at effort max must never be used in an automatic selection: a
      resolver may reach it only when a crew names the model explicitly
      (never automatic). The rule is narrowed to effort max, not model-level:
      chief round 10 explicitly places `gpt-5.6-luna | pi | xhigh |
      openai-sub` as an automatic escalation rung in both interactive crews,
      so Luna XHigh is not covered by this rule and remains eligible subject
      to the other rules and headroom.
    source: >-
      decisions.md D152 (model-routing ladder for the escalation cascade);
      D187 (D152-D158 ladder rules bind the crew-aware resolver); D204 item 2
      (never-automatic set unchanged: Fable 5.1, Opus 5, Luna Max); chief
      round 10 (chief-answers-10.md: the interactive crews' escalation ladders
      name `gpt-5.6-luna | pi | xhigh | openai-sub` as an automatic rung,
      disambiguating the Luna rule to effort max)

role_scoped:
  - model_ref: gemini-3.1-pro
    allowed_role_classes:
      - planning_review
    denied_role_classes:
      - coding
    decision: >-
      Gemini 3.1 Pro is role-scoped eligible: for coding/implementation roles
      it is never chosen automatically (strict or flex) and bind to it is
      refused; for planner/reviewer roles it is eligible in strict, flex, and
      bind, subject to the same headroom and never-automatic rules as any
      other worker. Direction is model-to-roles only; this is not a
      class-to-model preference (D206).
    source: >-
      decisions.md D188 (amends D152/D153/D187; D189 confirms the mapping
      unchanged)

